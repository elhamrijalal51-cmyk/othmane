<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tableau de Bord - Othmane</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Othmane</a>
        <div class="nav-links">
            <a href="home.html">Tableau de bord</a>
            <a href="About.html">À propos</a>
            <a href="Contact.html">Contact</a>
        </div>
        <div class="nav-actions">
            <a href="index.html" class="btn-login" style="background: #ef4444;">Déconnexion</a>
            <button class="hamburger">
                <span class="line"></span>
                <span class="line"></span>
                <span class="line"></span>
            </button>
        </div>
    </nav>

    <main>
        <div class="hero">
            <h1>Bienvenue, Administrateur</h1>
            <p>Ceci est votre espace personnel. Vous pouvez gérer vos contenus et vos paramètres ici.</p>
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; width: 100%; margin-top: 2rem;">
                <div class="auth-card" style="padding: 1.5rem;">
                    <h3>Projets</h3>
                    <p style="font-size: 2rem; color: var(--primary); margin: 0.5rem 0;">12</p>
                    <p>En cours</p>
                </div>
                <div class="auth-card" style="padding: 1.5rem;">
                    <h3>Messages</h3>
                    <p style="font-size: 2rem; color: #10b981; margin: 0.5rem 0;">5</p>
                    <p>Nouveaux</p>
                </div>
                <div class="auth-card" style="padding: 1.5rem;">
                    <h3>Vues</h3>
                    <p style="font-size: 2rem; color: #f59e0b; margin: 0.5rem 0;">1,2k</p>
                    <p>Dernières 24h</p>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Othmane. Tous droits réservés.</p>
    </footer>

    <script src="index.js"></script>
