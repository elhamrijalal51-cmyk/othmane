<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Othmane</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Othmane</a>
        <div class="nav-links">
            <a href="index.html">Accueil</a>
            <a href="About.html">À propos</a>
            <a href="Contact.html">Contact</a>
        </div>
        <a href="login.html" class="btn-login">Connexion</a>
    </nav>

    <main>
        <div class="auth-card">
            <h2>Contactez-nous</h2>
            <p>Une question ? Un projet ? Écrivez-nous !</p>
            <form>
                <div class="form-group">
                    <label for="name">Nom complet</label>
                    <input type="text" id="name" placeholder="Votre nom" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="votre@email.com" required>
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" style="width: 100%; padding: 0.75rem 1rem; background: rgba(15, 23, 42, 0.5); border: 1px solid var(--border); border-radius: 0.5rem; color: white; font-family: inherit; min-height: 120px;" placeholder="Comment pouvons-nous vous aider ?"></textarea>
                </div>
                <button type="submit" class="btn-submit">Envoyer</button>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Othmane. Tous droits réservés.</p>
    </footer>

    <script src="index.js"></script>
</body>
</html>
